[toolchain]
# Pinned because `src/preview/relay-binary.generated.ts` embeds the exact bytes this compiler
# produces, and CI requires a rebuild to match them. A floating stable would turn the check red
# on the next Rust release. Bump this and re-embed together.
channel = "1.99.1"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
