<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniBox</title>
  <meta name="description" content="MiniBox：为 AI Agent 准备的个人开发环境" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <script>
    (() => {
      var t = localStorage.getItem("minibox.theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/overview" aria-label="MiniBox 首页"><img data-logo src="/assets/logo.svg" alt="MiniBox" /></a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-nav="overview"><span data-icon="dashboard"></span>概览</a>
        <div class="nav-section">资源</div>
        <a href="#/boxes" data-nav="boxes"><span data-icon="box"></span>Box<span class="count" id="navBoxCount"></span></a>
        <a href="#/snapshots" data-nav="snapshots"><span data-icon="camera"></span>快照</a>
        <a href="#/templates" data-nav="templates"><span data-icon="layers"></span>模板</a>
        <div class="nav-section">系统</div>
        <a href="#/settings" data-nav="settings"><span data-icon="settings"></span>设置</a>
      </nav>
      <div class="sidebar-foot" id="sidebarFoot">MiniBox</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航"><span data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <a class="pill hide-sm" id="hostPill" href="#/overview" title="宿主机状态"><span class="dot"></span><span id="hostPillText">正在连接…</span></a>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换浅色 / 深色"></button>
        <button class="icon-btn" id="logoutBtn" aria-label="退出登录" title="退出登录"><span data-icon="logout"></span></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
