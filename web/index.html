<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MiniBox</title>
  <meta name="description" content="MiniBox: personal dev environments for AI agents" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation" data-i18n-attr="aria-label:nav.main">
      <a class="brand" href="#/overview" aria-label="MiniBox home" data-i18n-attr="aria-label:nav.home"><img data-logo src="/assets/logo.svg" alt="MiniBox" /></a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-nav="overview"><span data-icon="dashboard"></span><span data-i18n="nav.overview">Overview</span></a>
        <a href="#/boxes" data-nav="boxes"><span data-icon="box"></span><span data-i18n="nav.boxes">Boxes</span><span class="count" id="navBoxCount"></span></a>
        <a href="#/storage/volumes" data-nav="storage"><span data-icon="disk"></span><span data-i18n="nav.storage">Storage</span></a>
        <a href="#/library/templates" data-nav="library"><span data-icon="layers"></span><span data-i18n="nav.library">Library</span></a>
        <a href="#/activity" data-nav="activity"><span data-icon="activity"></span><span data-i18n="nav.activity">Activity</span></a>
        <a href="#/settings" data-nav="settings"><span data-icon="settings"></span><span data-i18n="nav.settings">Settings</span></a>
      </nav>
      <a class="sidebar-foot" id="sidebarVersion" href="#/about" data-nav="about" data-i18n-attr="title:nav.about">MiniBox</a>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" data-i18n-attr="aria-label:shell.openNav"><span data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <select class="select host-filter" id="hostFilter" hidden data-i18n-attr="aria-label:shell.hostFilter"></select>
        <a class="pill hide-sm" id="hostPill" href="#/overview" title="Host status" data-i18n-attr="title:shell.hostStatus"><span class="dot"></span><span id="hostPillText" data-i18n="common.connecting">Connecting…</span></a>
        <button class="icon-btn" id="tasksBtn" aria-label="Tasks" title="Tasks" data-i18n-attr="aria-label:shell.tasks;title:shell.tasks"><span data-icon="activity"></span></button>
        <button class="icon-btn" id="langBtn"></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Switch light / dark" data-i18n-attr="aria-label:shell.toggleTheme;title:shell.toggleThemeTitle"></button>
        <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out" data-i18n-attr="aria-label:shell.logout;title:shell.logout"><span data-icon="logout"></span></button>
      </header>
      <div class="owner-key-banner" id="ownerKeyBanner" hidden></div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
    <button type="button" class="nav-scrim" id="navScrim" aria-label="Close navigation" data-i18n-attr="aria-label:shell.closeNav" tabindex="-1"></button>
    <nav class="tabbar" id="tabbar" aria-label="Sections" data-i18n-attr="aria-label:shell.tabbar">
      <a href="#/overview" data-tab="overview"><span data-icon="dashboard"></span><span data-i18n="nav.overview">Overview</span></a>
      <a href="#/boxes" data-tab="boxes"><span data-icon="box"></span><span data-i18n="nav.boxes">Boxes</span></a>
      <a href="#/activity" data-tab="activity"><span data-icon="activity"></span><span data-i18n="nav.activity">Activity</span></a>
      <button type="button" id="moreBtn" data-tab="more" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span><span data-i18n="nav.more">More</span></button>
    </nav>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="/vendor/xterm/xterm.js" defer></script>
  <script src="/vendor/xterm-addon-fit/addon-fit.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
