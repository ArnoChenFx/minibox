<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniBox</title>
  <meta name="description" content="MiniBox: personal dev environments for AI agents" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <script>
    (() => {
      var t = localStorage.getItem("minibox.theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script>
    (() => {
      var l = localStorage.getItem("minibox.lang");
      if (l !== "en" && l !== "zh-CN") l = /^zh/i.test(navigator.language || "") ? "zh-CN" : "en";
      document.documentElement.lang = l;
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Main navigation" data-i18n-attr="aria-label:nav.main">
      <a class="brand" href="#/overview" aria-label="MiniBox home" data-i18n-attr="aria-label:nav.home"><img data-logo src="/assets/logo.svg" alt="MiniBox" /></a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-nav="overview"><span data-icon="dashboard"></span><span data-i18n="nav.overview">Overview</span></a>
        <div class="nav-section" data-i18n="nav.resources">Resources</div>
        <a href="#/boxes" data-nav="boxes"><span data-icon="box"></span><span data-i18n="nav.boxes">Boxes</span><span class="count" id="navBoxCount"></span></a>
        <a href="#/snapshots" data-nav="snapshots"><span data-icon="camera"></span><span data-i18n="nav.snapshots">Snapshots</span></a>
        <a href="#/templates" data-nav="templates"><span data-icon="layers"></span><span data-i18n="nav.templates">Templates</span></a>
        <div class="nav-section" data-i18n="nav.system">System</div>
        <a href="#/settings" data-nav="settings"><span data-icon="settings"></span><span data-i18n="nav.settings">Settings</span></a>
      </nav>
      <div class="sidebar-foot" id="sidebarVersion">MiniBox</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" data-i18n-attr="aria-label:shell.openNav"><span data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <a class="pill hide-sm" id="hostPill" href="#/overview" title="Host status" data-i18n-attr="title:shell.hostStatus"><span class="dot"></span><span id="hostPillText" data-i18n="common.connecting">Connecting…</span></a>
        <button class="icon-btn" id="langBtn"></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Switch light / dark" data-i18n-attr="aria-label:shell.toggleTheme;title:shell.toggleThemeTitle"></button>
        <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out" data-i18n-attr="aria-label:shell.logout;title:shell.logout"><span data-icon="logout"></span></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
