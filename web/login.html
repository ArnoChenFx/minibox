<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · MiniBox</title>
  <meta name="description" content="MiniBox: personal dev environments for AI agents" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-page">
    <section class="login-hero" aria-hidden="true">
      <img src="/assets/logo-dark.svg" alt="" style="height:30px;align-self:flex-start" />
      <div class="hero-body">
        <h1 data-i18n-html="login.heroTitle">Personal dev environments<br />for AI agents</h1>
        <p class="lead" data-i18n="login.lead"></p>
        <ul>
          <li data-icon="box"><span data-i18n="login.feat1"></span></li>
          <li data-icon="camera"><span data-i18n="login.feat2"></span></li>
          <li data-icon="activity"><span data-i18n="login.feat3"></span></li>
          <li data-icon="terminal"><span data-i18n="login.feat4"></span></li>
        </ul>
      </div>
    </section>
    <section class="login-panel">
      <div class="login-tools"><button class="icon-btn" id="langBtn"></button><button class="icon-btn" id="themeBtn" aria-label="Toggle theme" data-i18n-attr="aria-label:shell.toggleTheme"></button></div>
      <form class="login-card" id="loginForm" novalidate>
        <img class="logo" data-logo src="/assets/logo.svg" alt="MiniBox" />
        <h2 data-i18n="login.heading">Sign in to the console</h2>
        <p class="sub" data-i18n="login.sub">Enter your access key to continue.</p>
        <div class="field">
          <label class="label" for="key" data-i18n="login.keyLabel">Access key</label>
          <div class="input-group"><span data-icon="key"></span><input class="input" id="key" name="key" type="password" autocomplete="current-password" placeholder="Paste the 64-character access key" data-i18n-attr="placeholder:login.keyPlaceholder" autofocus required /></div>
          <div class="error-text" id="err" role="alert"></div>
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit" data-i18n="login.submit">Sign in</button>
        <p class="note" data-i18n-html="login.note"></p>
      </form>
    </section>
  </div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
