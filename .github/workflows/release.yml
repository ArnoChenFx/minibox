name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arnochenfx/minibox
  AGENT_IMAGE: ghcr.io/arnochenfx/minibox-agent

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json first."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  relay:
    name: Rebuild relay binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build and embed the relay
        run: |
          RELAY_FLAGS='-C target-feature=+crt-static -C linker=rust-lld'
          RUSTFLAGS="$RELAY_FLAGS" cargo build --release --target x86_64-unknown-linux-musl --manifest-path relay/Cargo.toml
          RUSTFLAGS="$RELAY_FLAGS" cargo build --release --target aarch64-unknown-linux-musl --manifest-path relay/Cargo.toml
          bun scripts/build-relay.ts
      - name: The committed embed matches the tagged source
        run: git diff --exit-code src/preview/relay-binary.generated.ts

  image:
    name: Build & push image
    needs: [checks, verify, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINIBOX_VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-image:
    name: Build & push agent image
    needs: [checks, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINIBOX_VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  release:
    name: GitHub Release
    needs: [checks, verify, image, agent-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Docker"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker pull ${AGENT_IMAGE}:${VERSION}"
            echo '```'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: MiniBox v${{ needs.verify.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
