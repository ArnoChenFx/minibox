name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium
      - name: Test
        run: bun test --timings="$RUNNER_TEMP/test-timings.json" --update-timings
      - name: Test file durations
        if: always()
        run: bun scripts/test-durations.ts "$RUNNER_TEMP/test-timings.json"

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: minibox:ci
          build-args: |
            MINIBOX_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and probe /login
        run: |
          docker run -d --name minibox-ci -p 3920:3920 -e ACCESS_KEY=ci-smoke-key minibox:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3920/login; then echo "ok after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs minibox-ci
          exit 1
      - name: Base template builds for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: templates/base
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=base-template
          cache-to: type=gha,mode=max,scope=base-template
      - name: Base template box checks on linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: templates/base
          platforms: linux/amd64
          load: true
          tags: minibox-template:base
          cache-from: type=gha,scope=base-template
      - run: scripts/check-box-image.sh minibox-template:base
      - name: Base template box checks on linux/arm64 (emulated)
        uses: docker/build-push-action@v7
        with:
          context: templates/base
          platforms: linux/arm64
          load: true
          tags: minibox-template:base-arm64
          cache-from: type=gha,scope=base-template
      - run: PLATFORM=linux/arm64 scripts/check-box-image.sh minibox-template:base-arm64

  official-templates:
    name: Official template builds (smoke)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: node
          - template: python
          - template: go
          - template: minimal
            tools: git curl ps tmux jq rg ssh unzip less vim.tiny ping socat bwrap
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the ${{ matrix.template }} template for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: templates/official/${{ matrix.template }}
          platforms: linux/amd64
          push: false
          load: true
          tags: minibox-official:${{ matrix.template }}
          cache-from: type=gha,scope=official-${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=official-${{ matrix.template }}
      - name: Box checks on linux/amd64
        env:
          REQUIRED_TOOLS: ${{ matrix.tools }}
        run: scripts/check-box-image.sh minibox-official:${{ matrix.template }}

  agent-image:
    name: Agent image (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the agent for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Agent image for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: false
          load: true
          tags: minibox-agent:ci
          cache-from: type=gha,scope=agent
      - run: scripts/check-agent-image.sh minibox-agent:ci
      - name: Agent image for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/arm64
          push: false
          load: true
          tags: minibox-agent:ci-arm64
          cache-from: type=gha,scope=agent
      - run: PLATFORM=linux/arm64 scripts/check-agent-image.sh minibox-agent:ci-arm64
