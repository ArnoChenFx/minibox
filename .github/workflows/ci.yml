name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: minibox:ci
          build-args: |
            MINIBOX_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and probe /login
        run: |
          docker run -d --name minibox-ci -p 3920:3920 -e ACCESS_KEY=ci-smoke-key minibox:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3920/login; then echo "ok after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs minibox-ci
          exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Base template, box privileges and network isolation
        run: bash scripts/check-box-image.sh
